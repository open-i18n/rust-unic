name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  stable:
    name: Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --manifest-path unic/ucd/normal/Cargo.toml

  regenerate:
    name: Regenerate Unicode tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --package=unic-gen
      - name: Check for generated changes
        run: |
          status=$(git status --porcelain=v1 --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff HEAD --
            exit 1
          fi

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --manifest-path unic/ucd/normal/Cargo.toml
